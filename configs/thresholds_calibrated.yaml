# CALIBRATED thresholds -- generated by scripts/08_calibrate.py.
# DO NOT hand-edit. Regenerate after adding controls.
# Each cut is the 95-th percentile of the matching NEGATIVE distribution,
# raised to the seed-replicate noise p95 where noise dominates, mirroring the
# organisers' 'clears 300%% over the negative control' rule: the threshold is
# defined by the negatives, not chosen in advance.
#
# These REPLACE the provisional values in configs/challenge.yaml, which are
# left in place so the change stays auditable.
calibrated_thresholds:
  bsa_peptide:
    value: 97.2
    provisional: false
    source: negative_control_p95
    real_designs_passing: 14/32
  iptm_binder_peptide_g12d:
    value: 0.7746
    provisional: false
    source: negative_control_p95
    real_designs_passing: 8/32
  iptm_g12d:
    value: 0.7009
    provisional: false
    source: negative_control_p95
    real_designs_passing: 8/32
  iptm_margin_empty:
    value: 0.3352
    provisional: false
    source: negative_control_p95
    real_designs_passing: 4/32
  iptm_margin_wt:
    # !! DO NOT USE AS A GATE !!
    # This cut was derived from SINGLE-sample seed noise, whose p95 was 0.404.
    # At the 5 averaged diffusion samples the final Boltz run actually uses, the
    # noise floor is ~2.6x lower (mean |seed A - seed B| 0.136 -> 0.053), so this
    # value is far too strict: it passes 0/32 real designs. Recalibrating it
    # needs 5-sample negative controls, which were not run.
    # scripts/60_rank.py therefore RANKS on iptm_margin_wt lexicographically and
    # does NOT gate on this number. Anything that starts gating on it will
    # silently reject every design.
    value: 0.4041
    provisional: false
    source: negative_control_p95
    real_designs_passing: 0/32
  n_peptide_contacts:
    value: 4.0
    provisional: false
    source: negative_control_p95
    real_designs_passing: 12/32
  peptide_contact_fraction_area:
    value: 0.1751
    provisional: false
    source: negative_control_p95
    real_designs_passing: 5/32
